<svg viewBox="0 0 540 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sunRayGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="60%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>
    <linearGradient id="earthGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
  </defs>

  <!-- Emblem Left (Centered at x=80, y=80) -->
  <g transform="translate(0, 0)">
    <!-- Sun Rays Background -->
    <path d="M 85 24 L 92 14 Q 102 18 112 24 L 102 32 Z" fill="url(#sunRayGrad)" />
    <path d="M 108 36 L 122 28 Q 130 36 138 46 L 122 52 Z" fill="url(#sunRayGrad)" />
    <path d="M 125 58 L 143 54 Q 148 64 150 76 L 131 77 Z" fill="url(#sunRayGrad)" />
    <path d="M 132 83 L 151 86 Q 150 97 146 108 L 128 99 Z" fill="url(#sunRayGrad)" />

    <!-- Concentric Sun Halo -->
    <path d="M 68 35 C 95 24 125 35 138 58 C 142 66 144 76 142 86 L 132 81 C 134 74 132 66 128 60 C 118 43 95 35 74 44 Z" fill="url(#sunRayGrad)" />
    <path d="M 62 47 C 82 38 108 45 120 64 C 124 70 126 78 125 86 L 117 83 C 117 77 115 71 112 66 C 103 52 82 46 66 54 Z" fill="#F59E0B" />

    <!-- Clouds -->
    <path d="M 88 56 C 88 53 91 50 94 50 C 95 48 98 47 101 48 C 103 48 105 50 106 52 C 108 52 110 54 110 56 C 110 58 108 60 106 60 L 90 60 C 88 60 88 58 88 56 Z" fill="#BAE6FD" opacity="0.9" />
    <path d="M 115 70 C 115 68 117 66 119 66 C 120 65 122 64 124 65 C 126 65 127 66 128 67 C 129 67 131 68 131 70 C 131 71 130 72 128 72 L 117 72 C 115 72 115 71 115 70 Z" fill="#BAE6FD" opacity="0.8" />

    <!-- Mountains -->
    <polygon points="76,105 92,66 108,105" fill="#15803D" />
    <polygon points="92,66 98,80 92,86 86,80" fill="#E2E8F0" opacity="0.6" />
    <polygon points="98,105 110,75 122,105" fill="#166534" />

    <!-- Trees -->
    <g fill="#22C55E">
      <polygon points="72,105 76,96 80,105" />
      <polygon points="80,105 84,94 88,105" />
      <polygon points="88,105 92,93 96,105" />
      <polygon points="96,105 100,94 104,105" />
      <polygon points="104,105 108,95 112,105" />
      <polygon points="112,105 116,97 120,105" />
    </g>

    <!-- Earth Base -->
    <path d="M 64 105 C 64 128 82 142 105 142 C 122 142 134 133 138 120 C 120 134 92 134 76 120 C 70 115 66 109 64 105 Z" fill="url(#earthGrad)" />
    <ellipse cx="100" cy="118" rx="28" ry="12" fill="#16A34A" opacity="0.85" />

    <!-- Leaf -->
    <path d="M 52 142 C 34 135 18 116 14 92 C 10 70 18 45 36 28 C 38 26 42 27 41 30 C 36 48 38 72 50 90 C 58 102 70 112 84 118 C 76 126 64 136 52 142 Z" fill="url(#leafGrad)" />
    <path d="M 28 42 C 32 65 42 88 64 106" stroke="#86EFAC" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Typography Right -->
  <g transform="translate(165, 0)">
    <!-- "Sun" in Orange -->
    <text x="0" y="88" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="78" fill="#F97316" letter-spacing="-1">Sun</text>
    <!-- "vault" in Green -->
    <text x="142" y="88" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="78" fill="#16A34A" letter-spacing="-1">vault</text>
    <!-- "POWERTECH PVT LTD" Subtitle -->
    <text x="4" y="125" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="20" fill="#475569" letter-spacing="4">POWERTECH PVT LTD</text>
  </g>
</svg>
